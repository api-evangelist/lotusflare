description: 'LotusFlare is a cloud-native digital commerce and monetization platform
  for telecommunications operators. Its Digital Network Operator (DNO) Cloud provides
  charging, product catalog, ordering, and digital customer-experience (BSS) capabilities
  as a managed SaaS to mobile carriers, and powers eSIM and travel-connectivity brands.
  The platform is delivered to enterprise telecom customers rather than through a public
  self-serve developer API; no public developer portal or API definition was discoverable
  at profile time. Backed by GV and Social Capital.'
